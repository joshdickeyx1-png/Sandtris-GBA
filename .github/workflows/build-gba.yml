          def function_span(src, name):
              # Deliberately locate by the function-name token instead of assuming an exact
              # declaration format. Earlier patches can change qualifiers/spacing.
              for m in re.finditer(r'\b' + re.escape(name) + r'\s*\(', src):
                  line_start = src.rfind('\n', 0, m.start()) + 1
                  prefix = src[line_start:m.start()]
                  if 'void' not in prefix:
                      continue
                  brace = src.find('{', m.end())
                  if brace < 0:
                      continue
                  # Ensure this is a definition, not a prototype.
                  semi = src.find(';', m.end(), brace + 1)
                  if semi != -1:
                      continue
                  depth = 0
                  for i in range(brace, len(src)):
                      if src[i] == '{':
                          depth += 1
                      elif src[i] == '}':
                          depth -= 1
                          if depth == 0:
                              return line_start, i + 1
              raise SystemExit(f"ERROR: {name}() definition not found.")

          # Remove only the Stage-1 dynamic-space hook from drawBoard. Stage 2's
          # milestone hook remains in place. This avoids depending on drawBoard's
          # declaration formatting.
          hook = '    drawDynamicSpaceTick();\n'
          hook_pos = s.find(hook)
