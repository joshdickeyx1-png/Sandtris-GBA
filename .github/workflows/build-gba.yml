      - name: Apply v0.5.1 Gravity Shift tuning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('game.c')
          s = p.read_text()

          old = "static int gravityFrame = 0;\nstatic int gravityWarning = 0;"
          new = "static int gravityFrame = 0;\nstatic int gravityWarning = 0;\nstatic int gravityNextDir = 1;"
          if old not in s:
              raise SystemExit('ERROR: gravity globals not found for v0.5.1 tuning.')
          s = s.replace(old, new, 1)

          old = "    gravityFrame = 0;\n    gravityWarning = 0;"
          new = "    gravityFrame = 0;\n    gravityWarning = 0;\n    gravityNextDir = 1;"
          if old not in s:
              raise SystemExit('ERROR: gravity init reset not found for v0.5.1 tuning.')
          s = s.replace(old, new, 1)

          # Locate the generated v0.5.0 function with brace matching instead of indentation.
          signature = 'static void updateWorldGravity(void) {'
          start = s.find(signature)
          if start < 0:
              raise SystemExit('ERROR: updateWorldGravity() start not found for v0.5.1.')
          brace = s.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('ERROR: updateWorldGravity() closing brace not found for v0.5.1.')
          replacement = r'''static void updateWorldGravity(void) {
              if (!gravityModeEnabled) { updateWorld(); return; }

              enum { GRAVITY_REST_FRAMES = 900,
                     GRAVITY_SIDE_BURST_FRAMES = 180,
                     GRAVITY_UP_BURST_FRAMES = 120,
                     GRAVITY_WARNING_FRAMES = 90,
                     GRAVITY_UP_SAFE_ROW = 24 };

              gravityFrame++;

              if (gravityDir == 0) {
                  gravityWarning = (gravityFrame >= GRAVITY_REST_FRAMES - GRAVITY_WARNING_FRAMES);
                  if (gravityFrame >= GRAVITY_REST_FRAMES) {
                      gravityDir = gravityNextDir;
                      gravityNextDir++;
                      if (gravityNextDir > 3) gravityNextDir = 1;
                      gravityFrame = 0;
                      gravityWarning = 0;
                      gravityWakeChunks();
                  } else {
                      updateWorld();
                      return;
                  }
              } else {
                  const int burstFrames = (gravityDir == 2) ? GRAVITY_UP_BURST_FRAMES : GRAVITY_SIDE_BURST_FRAMES;
                  gravityWarning = 0;
                  if (gravityFrame >= burstFrames) {
                      gravityDir = 0;
                      gravityFrame = 0;
                      gravityWakeChunks();
                      updateWorld();
                      return;
                  }
              }

              if (gravityFrame & 1) return;

              if (gravityDir == 2) {
                  for (int y = GRAVITY_UP_SAFE_ROW + 1; y < BOARD_HEIGHT; y++)
                      for (int x = 1; x <= BOARD_WIDTH; x++)
                          gravityMoveCell(y, x, -1, 0, 0, 1);
              } else if (gravityDir == 1) {
                  for (int x = 1; x <= BOARD_WIDTH; x++)
                      for (int y = 1; y < BOARD_HEIGHT - 1; y++)
                          gravityMoveCell(y, x, 0, -1, 1, 0);
              } else if (gravityDir == 3) {
                  for (int x = BOARD_WIDTH; x >= 1; x--)
                      for (int y = 1; y < BOARD_HEIGHT - 1; y++)
                          gravityMoveCell(y, x, 0, 1, 1, 0);
              }
              gravityWakeChunks();
          }

          '''
          s = s[:start] + replacement + s[end:]

          s = s.replace('MIYOO EDITION v0.5.0', 'MIYOO EDITION v0.5.1', 1)
          for g in ('GRAVITY_REST_FRAMES = 900','GRAVITY_SIDE_BURST_FRAMES = 180','GRAVITY_UP_BURST_FRAMES = 120','GRAVITY_UP_SAFE_ROW = 24','gravityNextDir = 1','MIYOO EDITION v0.5.1'):
              if g not in s:
