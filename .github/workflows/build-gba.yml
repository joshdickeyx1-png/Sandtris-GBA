              static const signed char circleY[64] = {
                  0,6,12,19,24,30,36,40,45,49,53,56,59,61,63,64,
                  64,64,63,61,59,56,53,49,45,40,36,30,24,19,12,6,
                  0,-6,-12,-19,-24,-30,-36,-40,-45,-49,-53,-56,-59,-61,-63,-64,
                  -64,-64,-63,-61,-59,-56,-53,-49,-45,-40,-36,-30,-24,-19,-12,-6
              };

              int level = visualizerAudioLevel();
              visualizerFrame++;
              for (int i = 0; i < WIDTH * HEIGHT; i++)
                  visualizerBuffer[i] = COL_BLACK;

              u32 seed = 0xB14C40E1u;
              for (int i = 0; i < 74; i++) {
                  seed = seed * 1664525u + 1013904223u;
                  int x = (seed >> 16) % WIDTH;
                  seed = seed * 1664525u + 1013904223u;
                  int y = (seed >> 16) % HEIGHT;
                  vizPixel(y, x, (i % 11 == 0) ? COL_WHITE : 0x4210);
              }

              const int cx = 120, cy = 80;
              const int innerR = 17, outerR = 70;
              int pullSpeed = 1 + level / 10;
              int particles = 330 + level * 5;
              if (particles > 480) particles = 480;

              // Particles spiral continuously INWARD. At the horizon they respawn outside.
              for (int i = 0; i < particles; i++) {
                  int travel = (int)(((u32)i * 29u + visualizerFrame * (u32)pullSpeed) %
                                     (u32)(outerR - innerR));
                  int radius = outerR - travel;
                  int baseAngle = (i * 17 + (i >> 3) * 7) & 63;
                  int curl = (outerR - radius) >> 1;
                  int angle = (baseAngle + curl + (int)(visualizerFrame >> 2)) & 63;
                  int x = cx + (circleX[angle] * radius) / 64;
                  int y = cy + (circleY[angle] * radius) / 64;
                  u16 c = sandCols[(i + (travel >> 3)) & 3];
                  vizPixel(y, x, c);
                  if (level > 22 && (i % 7) == 0) vizPixel(y, x + 1, c);
              }

              // True circular accretion ring.
              int ringR = innerR + 2 + level / 8;
              if (ringR > 24) ringR = 24;
              for (int a = 0; a < 64; a++) {
