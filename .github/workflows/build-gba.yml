name: Build GBA ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Generate custom music files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          raw_path = Path("assets/audio/typeA.raw")
          c_path = Path("assets/typeA.c")
          h_path = Path("assets/typeA.h")
          audio_path = Path("audio.c")

          if not raw_path.exists():
              raise SystemExit("ERROR: assets/audio/typeA.raw was not found.")

          data = raw_path.read_bytes()
          byte_count = len(data)
          sample_rate = 16834
          loop_blocks = math.ceil(byte_count / 65536)

          print(f"Music bytes: {byte_count}")
          print(f"Approx duration: {byte_count / sample_rate:.2f} seconds")
          print(f"Loop blocks: {loop_blocks}")

          h_path.write_text(
              "#ifndef TYPE_A_H\n"
              "#define TYPE_A_H\n\n"
              f"#define typeA_bytes {byte_count}\n"
              f"#define typeA_sampleRate {sample_rate}\n"
              f"#define typeA_loopBlocks {loop_blocks}\n\n"
              "extern const char typeA[];\n\n"
              "#endif\n"
          )

          # Keep the same representation the original project expects.
          with c_path.open("w", newline="\n") as f:
              f.write('#include "typeA.h"\n\n')
              f.write("const char typeA[] =\n")
              for i in range(0, byte_count, 32):
                  chunk = data[i:i+32]
                  f.write('"' + ''.join(f"\\x{b:02x}" for b in chunk) + '"\n')
              f.write(";\n")

          source = audio_path.read_text()
          source, count = re.subn(
              r"TIMER2_REGDATA\s*=\s*65536\s*-\s*(?:\d+|typeA_loopBlocks)\s*;",
              "TIMER2_REGDATA = 65536 - typeA_loopBlocks;",
              source
          )
          if count != 1:
              raise SystemExit("ERROR: Could not patch TIMER2_REGDATA in audio.c.")

          audio_path.write_text(source)
          PY

      - name: Allow large embedded audio string
        shell: bash
        run: |
          # The project's flags use -Werror. GCC warns when a C string is
          # larger than ISO C's guaranteed 4095-character minimum.
          # The ARM GCC toolchain can still compile it, so make only this
          # warning non-fatal.
          sed -i 's/-Werror=vla/-Werror=vla -Wno-error=overlength-strings/' Makefile

          echo "Compiler flags after patch:"
          grep -n "Werror=vla" Makefile || true

      - name: Verify generated music
        run: |
          grep "typeA_bytes" assets/typeA.h
          grep "typeA_loopBlocks" assets/typeA.h
          grep "TIMER2_REGDATA" audio.c
          ls -lh assets/audio/typeA.raw assets/typeA.c assets/typeA.h

      - name: Build ROM
        run: make

      - name: Verify ROM
        run: |
          test -f Sandtris.gba
          ls -lh Sandtris.gba
          sha256sum Sandtris.gba

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sandtris-gba-custom-music
          path: Sandtris.gba
          if-no-files-found: error
