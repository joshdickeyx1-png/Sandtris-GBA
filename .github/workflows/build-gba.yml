          from pathlib import Path
          import re

          p = Path('game.c')
          s = p.read_text()

          def function_span(src, name):
              m = re.search(r'(?m)^(?:static\s+)?(?:inline\s+)?[A-Za-z_][\w\s\*]*\b' + re.escape(name) + r'\s*\([^;]*\)\s*\{', src)
