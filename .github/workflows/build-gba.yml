name: Build Sandtris Miyoo Edition

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Generate custom music files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          raw_path = Path("assets/audio/typeA.raw")
          if not raw_path.exists():
              raise SystemExit("ERROR: assets/audio/typeA.raw was not found.")

          data = raw_path.read_bytes()
          byte_count = len(data)
          sample_rate = 16834
          loop_blocks = math.ceil(byte_count / 65536)

          header_lines = [
              "#ifndef TYPE_A_H",
              "#define TYPE_A_H",
              "",
              f"#define typeA_bytes {byte_count}",
              f"#define typeA_sampleRate {sample_rate}",
              f"#define typeA_loopBlocks {loop_blocks}",
              "",
              "extern const char typeA[];",
              "",
              "#endif",
              "",
          ]
          Path("assets/typeA.h").write_text("\n".join(header_lines))

          with Path("assets/typeA.c").open("w", newline="\n") as f:
              f.write('#include "typeA.h"\n\n')
              f.write("const char typeA[] =\n")
              for i in range(0, byte_count, 32):
                  chunk = data[i:i + 32]
                  escaped = "".join(f"\\x{b:02x}" for b in chunk)
                  f.write('"' + escaped + '"\n')
              f.write(";\n")

          audio_path = Path("audio.c")
          audio = audio_path.read_text()
          audio, count = re.subn(
              r"TIMER2_REGDATA\s*=\s*65536\s*-\s*(?:\d+|typeA_loopBlocks)\s*;",
              "TIMER2_REGDATA = 65536 - typeA_loopBlocks;",
              audio,
              count=1,
          )
          if count != 1:
              raise SystemExit("ERROR: Could not patch TIMER2_REGDATA in audio.c.")
          audio_path.write_text(audio)

          print(f"Custom music bytes: {byte_count}")
          print(f"Loop blocks: {loop_blocks}")
          PY

      - name: Apply Miyoo Edition v0.1 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          game_path = Path("game.c")
          header_path = Path("game.h")
          game = game_path.read_text()
          header = header_path.read_text()

          # Add PAUSE enum before GAMEOVER.
          if "    PAUSE," not in header:
              header, count = re.subn(
                  r"(\s*CLEAR3,\s*\n)(\s*GAMEOVER)",
                  r"\1    PAUSE,\n\2",
                  header,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not add PAUSE state to game.h.")

          # Add Miyoo state variables.
          if "static int musicEnabled" not in game:
              game, count = re.subn(
                  r"(static int highscores\[4\];)",
                  r"\1\nstatic int musicEnabled = 1;\nstatic enum state pausedState = FALL;",
                  game,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not add Miyoo state variables.")

          # Make music startup obey the toggle.
          if "if (musicEnabled)" not in game:
              music_pattern = (
                  r"(\s*// play audio\s*\n)"
                  r"(\s*reset_music\(\);\s*\n)"
                  r"\s*init_audio\(\);\s*\n"
                  r"\s*loop_music\(\);"
              )
              music_replacement = (
                  r"\1"
                  r"\2"
                  "    if (musicEnabled) {\n"
                  "        init_audio();\n"
                  "        loop_music();\n"
                  "    }"
              )
              game, count = re.subn(
                  music_pattern,
                  music_replacement,
                  game,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not patch music startup.")

          # Replace original global START behavior.
          if "pausedState = state;" not in game:
              start_pattern = (
                  r"\n\s*if \(key_hit\(BUTTON_START\)\)\s*\n"
                  r"\s*state = START;\s*\n"
                  r"\s*\n"
                  r"\s*switch \(state\)"
              )
              start_lines = [
                  "",
                  "    if (key_hit(BUTTON_START)) {",
                  "        if (state == TITLE) {",
                  "            state = START;",
                  "        } else if (state == PAUSE) {",
                  "            state = pausedState;",
                  "        } else if (state != START && state != GAMEOVER) {",
                  "            pausedState = state;",
                  "            state = PAUSE;",
                  "        }",
                  "    }",
                  "",
                  "    switch (state)",
              ]
              game, count = re.subn(
                  start_pattern,
                  "\n".join(start_lines),
                  game,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not patch START button handling.")

          # Replace TITLE case.
          if "MIYOO EDITION" not in game:
              title_pattern = (
                  r"    case TITLE:\s*\n"
                  r"\s*if \(key_hit\(BUTTON_START\)\)\s*\n"
                  r"\s*state = START;\s*\n"
                  r"\s*\n"
                  r"\s*waitForVBlank\(\);\s*\n"
                  r"\s*drawFullScreenImageDMA\(title\);\s*\n"
                  r"\s*break;"
              )
              title_lines = [
                  "    case TITLE:",
                  "        if (key_hit(BUTTON_A)) {",
                  "            musicEnabled = !musicEnabled;",
                  "        }",
                  "",
                  "        waitForVBlank();",
                  "        drawFullScreenImageDMA(title);",
                  '        drawCenteredString(108, 0, 240, 8, "MIYOO EDITION", COL_WHITE);',
                  '        drawCenteredString(132, 0, 240, 8, "START - PLAY", COL_WHITE);',
                  "        if (musicEnabled) {",
                  '            drawCenteredString(144, 0, 240, 8, "A - MUSIC ON", COL_WHITE);',
                  "        } else {",
                  '            drawCenteredString(144, 0, 240, 8, "A - MUSIC OFF", COL_WHITE);',
                  "        }",
                  "        break;",
              ]
              game, count = re.subn(
                  title_pattern,
                  "\n".join(title_lines),
                  game,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not patch TITLE state.")

          # Insert PAUSE case before GAMEOVER.
          if "case PAUSE:" not in game:
              pause_lines = [
                  "    case PAUSE:",
                  "        waitForVBlank();",
                  "        drawRectDMA(58, 60, 120, 44, COL_BLACK);",
                  '        drawCenteredString(68, 60, 120, 8, "PAUSED", COL_WHITE);',
                  '        drawCenteredString(84, 60, 120, 8, "START - RESUME", COL_WHITE);',
                  "        break;",
                  "",
              ]
              pause_code = "\n".join(pause_lines)
              game, count = re.subn(
                  r"(\s*case GAMEOVER:)",
                  "\n" + pause_code + r"\1",
                  game,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("ERROR: Could not add PAUSE case.")

          game_path.write_text(game)
          header_path.write_text(header)
          print("Applied Sandtris: Miyoo Edition v0.1")
          PY

      - name: Allow large embedded audio string
        run: |
          sed -i 's/-Werror=vla/-Werror=vla -Wno-error=overlength-strings/' Makefile

      - name: Verify Miyoo Edition patch
        run: |
          grep -n "MIYOO EDITION" game.c
          grep -n "case PAUSE" game.c
          grep -n "musicEnabled" game.c
          grep -n "pausedState" game.c
          grep -n "PAUSE" game.h
          grep -n "typeA_loopBlocks" assets/typeA.h

      - name: Build ROM
        run: make

      - name: Rename and verify ROM
        run: |
          test -f Sandtris.gba
          cp Sandtris.gba "Sandtris - Miyoo Edition v0.1.gba"
          ls -lh "Sandtris - Miyoo Edition v0.1.gba"
          sha256sum "Sandtris - Miyoo Edition v0.1.gba"

      - name: Upload Miyoo Edition ROM
        uses: actions/upload-artifact@v4
        with:
          name: Sandtris-Miyoo-Edition-v0.1-FIX3
          path: "Sandtris - Miyoo Edition v0.1.gba"
          if-no-files-found: error
