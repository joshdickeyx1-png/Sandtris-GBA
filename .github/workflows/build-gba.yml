                  }
              }

              // Round event horizon masks swallowed grains.
              int core = innerR - 3 + level / 16;
              if (core > innerR) core = innerR;
              for (int yy = -core; yy <= core; yy++)
                  for (int xx = -core; xx <= core; xx++)
