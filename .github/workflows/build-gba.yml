      - name: Apply v0.4.0 three-track Music Library
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re
          
          # ---------- Generate the two additional PCM assets ----------
          tracks = [
              ("usurper", Path("assets/audio/usurper.raw")),
              ("propagation", Path("assets/audio/propagation.raw")),
          ]
          SAMPLE_RATE = 16834
          
          for symbol, raw_path in tracks:
              if not raw_path.exists():
                  raise SystemExit(f"ERROR: {raw_path} was not found. Upload the two new .raw files from the kit into assets/audio/.")
              data = bytearray(raw_path.read_bytes())
              byte_count = len(data)

              fade_in = min(128, byte_count)
              fade_out = min(256, byte_count)
              for i in range(fade_in):
                  v = data[i] if data[i] < 128 else data[i] - 256
                  v = int(v * i / max(1, fade_in - 1))
                  data[i] = v & 0xFF
              for i in range(fade_out):
                  at = byte_count - fade_out + i
                  v = data[at] if data[at] < 128 else data[at] - 256
                  v = int(v * (fade_out - 1 - i) / max(1, fade_out - 1))
                  data[at] = v & 0xFF
              encoded_data = bytes(data) + bytes(32)

              loop_blocks = math.ceil(byte_count / 65536)
              Path(f"assets/{symbol}.h").write_text("\n".join([
                  f"#ifndef {symbol.upper()}_H",
                  f"#define {symbol.upper()}_H",
                  "",
                  f"#define {symbol}_bytes {byte_count}",
                  f"#define {symbol}_sampleRate {SAMPLE_RATE}",
                  f"#define {symbol}_loopBlocks {loop_blocks}",
                  "",
                  f"extern const char {symbol}[];",
                  "",
                  "#endif",
                  "",
              ]))
              with Path(f"assets/{symbol}.c").open("w", newline="\n") as f:
                  f.write(f'#include "{symbol}.h"\n\n')
                  f.write(f"const char {symbol}[] =\n")
                  for i in range(0, len(encoded_data), 32):
                      chunk = encoded_data[i:i + 32]
                      f.write('"' + ''.join(f"\\x{b:02x}" for b in chunk) + '"\n')
                  f.write(";\n")
              print(f"{symbol}: {byte_count} bytes, {loop_blocks} timer blocks")
          
          # ---------- Replace audio.c with a three-track playback engine ----------
          audio_c = r'''#include "audio.h"
          #include "gba.h"
          #include "assets/typeA.h"
          #include "assets/usurper.h"
          #include "assets/propagation.h"
          
          static const unsigned short ticks_per_sample = 16777216 / 16834;
          static volatile int musicMode = 0;
          static volatile int currentTrack = 0;
          static volatile int musicPlaying = 0;
          static volatile unsigned int musicBaseSamples = 0;
          static volatile unsigned int musicFullBlocksRemaining = 0;
          static volatile unsigned int musicRemainder = 0;
          static volatile unsigned int musicTimerStart = 0;
          static volatile int musicFinalPartial = 0;
          static unsigned int shuffleState = 0x51A7C0DEu;
          
          static const char *trackData(int track) {
              if (track == 1) return usurper;
              if (track == 2) return propagation;
              return typeA;
          }
          
          static unsigned int trackBytes(int track) {
              if (track == 1) return (unsigned int)usurper_bytes;
              if (track == 2) return (unsigned int)propagation_bytes;
              return (unsigned int)typeA_bytes;
          }
          
          static void chooseStartTrack(void) {
              if (musicMode >= 0 && musicMode <= 2) {
                  currentTrack = musicMode;
              } else {
                  shuffleState = shuffleState * 1664525u + 1013904223u;
                  currentTrack = (int)((shuffleState >> 16) % 3u);
              }
          }
          
          static void chooseNextTrack(void) {
              if (musicMode == 3) {
                  int old = currentTrack;
                  shuffleState = shuffleState * 1664525u + 1013904223u;
                  int next = (int)((shuffleState >> 16) % 3u);
                  if (next == old)
                      next = (next + 1) % 3;
                  currentTrack = next;
              } else {
                  currentTrack = (currentTrack + 1) % 3;
              }
          }
          
          static void startCurrentTrackHardware(void) {
              unsigned int bytes = trackBytes(currentTrack);
              if (bytes < 1u) bytes = 1u;
          
              TIMER1_REGCNT = 0;
              TIMER2_REGCNT = 0;
              DMA[DMA_CHANNEL_1].cnt = 0;
          
              // Reset FIFO exactly at the hand-off so queued bytes from the old song
              // cannot leak into the new song.
              REG_SOUNDCNT_H |= SOUND_A_RIGHT_CHANNEL | SOUND_A_LEFT_CHANNEL | SOUND_A_FIFO_RESET;
              DMA[DMA_CHANNEL_1].src = trackData(currentTrack);
              DMA[DMA_CHANNEL_1].dst = SOUND_A_FIFO_BUFFER;
              DMA[DMA_CHANNEL_1].cnt = DMA_ON | DMA_DESTINATION_FIXED | DMA_32 | DMA_REPEAT | DMA_AT_REFRESH;
          
              musicBaseSamples = 0;
              musicFullBlocksRemaining = bytes >> 16;
              musicRemainder = bytes & 0xFFFFu;
              musicFinalPartial = 0;
              musicTimerStart = 0;
          
              // TIMER1 is the exact song-length clock. Full 65536-sample chunks use
              // a zero reload. The final partial chunk gets its own precise reload,
              // eliminating the old ceil-to-65536 overrun that caused the end glitch.
              if (musicFullBlocksRemaining == 0u) {
                  musicFinalPartial = 1;
                  musicTimerStart = 65536u - musicRemainder;
                  TIMER1_REGDATA = (unsigned short)musicTimerStart;
              } else {
                  TIMER1_REGDATA = 0;
              }
              TIMER1_REGCNT = TIMER_ENABLE | TIMER_CASCADE | TIMER_INTERRUPT;
              REG_IE |= IRQ_TIMER1;
              REG_IME = 1;
              musicPlaying = 1;
          }
          
          void audio_set_music_mode(int mode) {
              if (mode < 0 || mode > 3) mode = 0;
              musicMode = mode;
              if (mode <= 2)
                  currentTrack = mode;
          }
          
          int audio_get_music_mode(void) {
              return musicMode;
          }
          
          int audio_get_current_track(void) {
              return currentTrack;
          }
          
          int audio_is_music_playing(void) {
              return musicPlaying;
          }
          
          int audio_music_level(void) {
              if (!musicPlaying)
                  return 6;
          
              int track = currentTrack;
              const signed char *data = (const signed char *)trackData(track);
              unsigned int bytes = trackBytes(track);
              if (!data || bytes == 0u)
                  return 6;
          
              unsigned int base = musicBaseSamples;
              unsigned int timerStart = musicTimerStart;
              unsigned int timerNow = (unsigned int)TIMER1_REGDATA;
              unsigned int within = (timerNow - timerStart) & 0xFFFFu;
              unsigned int pos = base + within;
              if (pos >= bytes)
                  pos = bytes - 1u;
          
              int total = 0;
              for (int i = 0; i < 8; i++) {
                  unsigned int at = pos + (unsigned int)(i * 97);
                  if (at >= bytes)
                      at = bytes - 1u;
                  int v = (int)data[at];
                  total += v < 0 ? -v : v;
              }
              int level = total >> 5;
              if (level < 4) level = 4;
              if (level > 31) level = 31;
              return level;
          }
          
          void __attribute__ ((target("arm"))) play_typeA(void) {
              startCurrentTrackHardware();
              REG_IF = IRQ_TIMER1;
          }
          
          void __attribute__ ((target("arm"))) stop_sfx(void) {
              REG_SOUNDCNT_H &= ~(SOUND_B_RIGHT_CHANNEL | SOUND_B_LEFT_CHANNEL);
              DMA[DMA_CHANNEL_2].cnt = 0;
              REG_IF = IRQ_TIMER3;
              TIMER3_REGCNT = 0;
          }
          
          static void advanceMusicClock(void) {
              if (!musicPlaying)
                  return;
          
              if (musicFinalPartial) {
                  TIMER1_REGCNT = 0;
                  DMA[DMA_CHANNEL_1].cnt = 0;
                  chooseNextTrack();
                  startCurrentTrackHardware();
                  return;
              }
          
              musicBaseSamples += 65536u;
              if (musicFullBlocksRemaining > 0u)
                  --musicFullBlocksRemaining;
          
              if (musicFullBlocksRemaining == 0u) {
                  if (musicRemainder != 0u) {
                      musicFinalPartial = 1;
                      musicTimerStart = 65536u - musicRemainder;
                      TIMER1_REGDATA = (unsigned short)musicTimerStart;
                  } else {
                      TIMER1_REGCNT = 0;
                      DMA[DMA_CHANNEL_1].cnt = 0;
                      chooseNextTrack();
                      startCurrentTrackHardware();
                  }
              } else {
                  musicTimerStart = 0;
                  TIMER1_REGDATA = 0;
              }
          }
          
          void __attribute__ ((target("arm"))) interrupt(void) {
              unsigned short flags = REG_IF;
              if (flags & IRQ_TIMER3)
                  stop_sfx();
          
              if (flags & IRQ_TIMER1) {
                  REG_IF = IRQ_TIMER1;
                  advanceMusicClock();
              }
          }
          
          void init_audio(void) {
              REG_SOUNDCNT_X = SOUND_MASTER_ENABLE;
              TIMER0_REGDATA = 65536 - ticks_per_sample;
              TIMER0_REGCNT = TIMER_ENABLE | TIMER_FREQ_1;
              REG_ISR_MAIN = interrupt;
          }
          
          void reset_music(void) {
              musicPlaying = 0;
              REG_SOUNDCNT_X = 0;
              REG_SOUNDCNT_H = 0;
              TIMER0_REGCNT = 0;
              TIMER1_REGCNT = 0;
              TIMER2_REGCNT = 0;
              TIMER3_REGCNT = 0;
              DMA[DMA_CHANNEL_1].cnt = 0;
              REG_IE = 0;
              REG_IME = 0;
          }
          
          void loop_music(void) {
              chooseStartTrack();
              startCurrentTrackHardware();
          }
          
          void stop_music(void) {
              musicPlaying = 0;
              REG_SOUNDCNT_H &= ~(SOUND_A_RIGHT_CHANNEL | SOUND_A_LEFT_CHANNEL);
              TIMER1_REGCNT = 0;
              TIMER2_REGCNT = 0;
              DMA[DMA_CHANNEL_1].cnt = 0;
          }
          
          void play_sfx(const char* sfx, int bytes) {
              REG_SOUNDCNT_H |= SOUND_B_RIGHT_CHANNEL | SOUND_B_LEFT_CHANNEL | SOUND_B_FIFO_RESET;
              DMA[DMA_CHANNEL_2].cnt = 0;
              DMA[DMA_CHANNEL_2].src = sfx;
              DMA[DMA_CHANNEL_2].dst = SOUND_B_FIFO_BUFFER;
              DMA[DMA_CHANNEL_2].cnt = DMA_ON | DMA_DESTINATION_FIXED | DMA_32 | DMA_REPEAT | DMA_AT_REFRESH;
          
              TIMER3_REGCNT = 0;
              TIMER3_REGDATA = 65536 - bytes + 1000;
              TIMER3_REGCNT = TIMER_ENABLE | TIMER_FREQ_1024 | TIMER_INTERRUPT;
              REG_IE |= IRQ_TIMER3;
              REG_IME = 1;
          }
          '''
          Path("audio.c").write_text(audio_c)
          
          # Add the new public audio helpers without disturbing the old API.
          ah = Path("audio.h")
          hs = ah.read_text()
          anchor = "void play_sfx(const char* sfx, int bytes);"
