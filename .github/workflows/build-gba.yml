name: Build Sandtris Miyoo Edition v0.3.0 FIX2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Generate custom music files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          raw_path = Path("assets/audio/typeA.raw")
          if not raw_path.exists():
              raise SystemExit("ERROR: assets/audio/typeA.raw was not found.")

          data = raw_path.read_bytes()
          byte_count = len(data)
          sample_rate = 16834
          loop_blocks = math.ceil(byte_count / 65536)

          Path("assets/typeA.h").write_text("\n".join([
              "#ifndef TYPE_A_H",
              "#define TYPE_A_H",
              "",
              f"#define typeA_bytes {byte_count}",
              f"#define typeA_sampleRate {sample_rate}",
              f"#define typeA_loopBlocks {loop_blocks}",
              "",
              "extern const char typeA[];",
              "",
              "#endif",
              "",
          ]))

          with Path("assets/typeA.c").open("w", newline="\n") as f:
              f.write('#include "typeA.h"\n\n')
              f.write("const char typeA[] =\n")
              for i in range(0, byte_count, 32):
                  chunk = data[i:i + 32]
                  f.write('"' + "".join(f"\\x{b:02x}" for b in chunk) + '"\n')
              f.write(";\n")

          audio_path = Path("audio.c")
          audio = audio_path.read_text()
          audio, count = re.subn(
              r"TIMER2_REGDATA\s*=\s*65536\s*-\s*(?:\d+|typeA_loopBlocks)\s*;",
              "TIMER2_REGDATA = 65536 - typeA_loopBlocks;",
              audio,
              count=1,
          )
          if count != 1:
              raise SystemExit("ERROR: Could not patch TIMER2_REGDATA in audio.c.")
          audio_path.write_text(audio)
          print(f"Custom music: {byte_count} bytes, {loop_blocks} loop blocks")
          PY

      - name: Apply Miyoo Edition v0.3.0 stability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          game_path = Path("game.c")
          header_path = Path("game.h")
          game = game_path.read_text()
          header = header_path.read_text()

          header, n = re.subn(
              r"(\s*CLEAR3,\s*\n)(\s*GAMEOVER)",
              r"\1    PAUSE,\n    SCORES,\n\2",
              header,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Could not patch game.h states.")

          lines = [
              "static int highscores[4];",
              "static int musicEnabled = 1;",
              "static int difficulty = 1;",
              "static int menuSelection = 0;",
              "static int gameOverHandled = 0;",
              "static int difficultyTick = 0;",
              "static int saveLoaded = 0;",
              "static int titleDirty = 1;",
              "static int titleBackgroundDrawn = 0;",
              "static int scoresDirty = 1;",
              "static int pauseDirty = 1;",
              "static enum state pausedState = FALL;",
              "",
              "#define SRAM8 ((volatile u8 *)0x0E000000)",
              '__attribute__((used)) const char saveTypeMarker[] = "SRAM_V113";',
              "",
              "static u32 sramRead32(int offset) {",
              "    return ((u32)SRAM8[offset]) |",
              "           ((u32)SRAM8[offset + 1] << 8) |",
              "           ((u32)SRAM8[offset + 2] << 16) |",
              "           ((u32)SRAM8[offset + 3] << 24);",
              "}",
              "",
              "static void sramWrite32(int offset, u32 value) {",
              "    SRAM8[offset] = value & 0xFF;",
              "    SRAM8[offset + 1] = (value >> 8) & 0xFF;",
              "    SRAM8[offset + 2] = (value >> 16) & 0xFF;",
              "    SRAM8[offset + 3] = (value >> 24) & 0xFF;",
              "}",
              "",
              "static void saveData(void) {",
              "    SRAM8[0] = 'S';",
              "    SRAM8[1] = 'M';",
              "    SRAM8[2] = 'E';",
              "    SRAM8[3] = '2';",
              "    for (int i = 0; i < 4; i++)",
              "        sramWrite32(4 + i * 4, (u32)highscores[i]);",
              "    SRAM8[20] = (u8)difficulty;",
              "    SRAM8[21] = (u8)(musicEnabled ? 1 : 0);",
              "}",
              "",
              "static void loadSave(void) {",
              "    if (saveLoaded)",
              "        return;",
              "    saveLoaded = 1;",
              "    if (SRAM8[0] == 'S' && SRAM8[1] == 'M' &&",
              "        SRAM8[2] == 'E' && SRAM8[3] == '2') {",
              "        for (int i = 0; i < 4; i++)",
              "            highscores[i] = (int)sramRead32(4 + i * 4);",
              "        difficulty = SRAM8[20] <= 2 ? SRAM8[20] : 1;",
              "        musicEnabled = SRAM8[21] ? 1 : 0;",
              "    } else {",
              "        for (int i = 0; i < 4; i++)",
              "            highscores[i] = 0;",
              "        difficulty = 1;",
              "        musicEnabled = 1;",
              "        saveData();",
              "    }",
              "}",
              "",
              "static void recordHighScore(int newScore) {",
              "    for (int i = 0; i < 4; i++) {",
              "        if (newScore <= highscores[i])",
              "            continue;",
              "        int displaced = highscores[i];",
              "        highscores[i] = newScore;",
              "        newScore = displaced;",
              "    }",
              "    saveData();",
              "}",

          ]
          game, n = re.subn(
              r"static int highscores\[4\];",
              "\n".join(lines),
              game,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Could not insert Miyoo data block.")

          init_old = (
              r"(\s*combo = 0;\s*\n)"
              r"(\s*fillNum = 1;\s*\n)"
              r"\s*\n"
              r"(\s*// play audio\s*\n)"
              r"\s*reset_music\(\);\s*\n"
              r"\s*init_audio\(\);\s*\n"
              r"\s*loop_music\(\);"
          )
          init_new = (
              r"\1"
              r"\2"
              "    gameOverHandled = 0;\n"
              "    difficultyTick = 0;\n"
              "    pauseDirty = 1;\n"
              "\n"
              r"\3"
              "    reset_music();\n"
              "    if (musicEnabled) {\n"
              "        init_audio();\n"
              "        loop_music();\n"
              "    }"
          )
          game, n = re.subn(init_old, init_new, game, count=1)
          if n != 1:
              raise SystemExit("ERROR: Could not patch init().")

          helper_lines = [
              "",
              "static int extraHardDrop(void) {",
              "    ++pieceCurr.y;",
              "    for (int i = 0; i < 4; i++) {",
              "        const int *cell = PIECES[pieceCurr.type][pieceCurr.rotation][i];",
              "        int x = pieceCurr.x + cell[0];",
              "        int y = pieceCurr.y + cell[1] + 8;",
              "        for (int offset = 0; offset < 8; offset++) {",
              "            if (board[y][x + offset + 1]) {",
              "                play_sfx(drop, drop_bytes);",
              "                return 1;",
              "            }",
              "        }",
              "    }",
              "    --comboMult;",
              "    return 0;",
              "}",
              "",
              "static int updatePieceMiyoo(void) {",
              "    ++difficultyTick;",
              "    if (difficulty == 0 && (difficultyTick & 1))",
              "        return 0;",
              "    if (updatePiece())",
              "        return 1;",
              "    if (difficulty == 2 && (difficultyTick % 3) == 0)",
              "        return extraHardDrop();",
              "    return 0;",
              "}",
              "",
              "static void restoreGameplayScreen(void) {",
              "    waitForVBlank();",
              "    drawFullScreenImageDMA(bg);",
              "    drawBoard();",
              "    drawPiece();",
              "    drawUI();",
              "    drawScore();",
              "}",
              "",
              "static void restoreTitleStrip(int row, int col, int width, int height) {",
              "    for (int y = 0; y < height; y++)",
              "        for (int x = 0; x < width; x++)",
              "            setPixel(row + y, col + x, title[OFFSET(row + y, col + x, WIDTH)]);",
              "}",
              "",
              "static void drawShadowString(int row, int col, char *str, u16 color) {",
              "    drawString(row + 1, col + 1, str, COL_BLACK);",
              "    drawString(row, col, str, color);",
              "}",
              "",
              "static void drawCenteredShadowString(int row, int col, int width, int height, char *str, u16 color) {",
              "    drawCenteredString(row + 1, col + 1, width, height, str, COL_BLACK);",
              "    drawCenteredString(row, col, width, height, str, color);",
              "}",
              "",
              "static void drawTitleMenu(void) {",
              "    waitForVBlank();",
              "    if (!titleBackgroundDrawn) {",
              "        drawFullScreenImageDMA(title);",
              "        titleBackgroundDrawn = 1;",
              "        drawCenteredShadowString(54, 38, 164, 8, \"MIYOO EDITION v0.3.0\", COL_WHITE);",
              "        drawCenteredShadowString(142, 38, 164, 8, \"UP/DOWN + A\", COL_WHITE);",
              "    }",
              "",
              "    restoreTitleStrip(73, 50, 164, 13);",
              "    restoreTitleStrip(89, 50, 164, 13);",
              "    restoreTitleStrip(105, 50, 164, 13);",
              "    restoreTitleStrip(121, 50, 164, 13);",
              "",
              "    char line[28];",
              "    snprintf(line, sizeof(line), \"%c START GAME\", menuSelection == 0 ? '>' : ' ');",
              "    drawShadowString(76, 54, line, menuSelection == 0 ? COL_YELLOW : COL_WHITE);",
              "    char *diffName = difficulty == 0 ? \"EASY\" : (difficulty == 1 ? \"NORMAL\" : \"HARD\");",
              "    snprintf(line, sizeof(line), \"%c DIFFICULTY: %s\", menuSelection == 1 ? '>' : ' ', diffName);",
              "    drawShadowString(92, 54, line, menuSelection == 1 ? COL_YELLOW : COL_WHITE);",
              "    snprintf(line, sizeof(line), \"%c MUSIC: %s\", menuSelection == 2 ? '>' : ' ', musicEnabled ? \"ON\" : \"OFF\");",
              "    drawShadowString(108, 54, line, menuSelection == 2 ? COL_YELLOW : COL_WHITE);",
              "    snprintf(line, sizeof(line), \"%c HIGH SCORES\", menuSelection == 3 ? '>' : ' ');",
              "    drawShadowString(124, 54, line, menuSelection == 3 ? COL_YELLOW : COL_WHITE);",
              "}",
              "",
              "static void drawScoresScreen(void) {",
              "    waitForVBlank();",
              "    drawFullScreenImageDMA(title);",
              "    drawCenteredShadowString(30, 34, 172, 8, \"MIYOO EDITION\", COL_WHITE);",
              "    drawCenteredShadowString(46, 34, 172, 8, \"HIGH SCORES\", COL_YELLOW);",
              "    char line[24];",
              "    for (int i = 0; i < 4; i++) {",
              "        snprintf(line, sizeof(line), \"%d. %d\", i + 1, highscores[i]);",
              "        drawCenteredShadowString(70 + i * 16, 34, 172, 8, line, i == 0 ? COL_YELLOW : COL_WHITE);",
              "    }",
              "    drawCenteredShadowString(140, 34, 172, 8, \"A/B/START - BACK\", COL_WHITE);",
              "}",
              "",
          ]
          marker = "\nvoid restart(void) {"
          if marker not in game:
              raise SystemExit("ERROR: Could not locate restart().")
          game = game.replace(marker, "\n".join(helper_lines) + marker, 1)

          old_call = "        if (updatePiece()) {\n            state = SPAWN;"
          if game.count(old_call) < 2:
              raise SystemExit("ERROR: Could not locate both updatePiece state calls.")
          game = game.replace(old_call, "        if (updatePieceMiyoo()) {\n            state = SPAWN;", 2)

          game, n = re.subn(
              r"void restart\(void\) \{\s*\n\s*reset_music\(\);\s*\n\s*state = TITLE;\s*\n\}",
              "\n".join([
                  "void restart(void) {",
                  "    reset_music();",
                  "    state = TITLE;",
                  "    titleDirty = 1;",
                  "    titleBackgroundDrawn = 0;",
                  "}",
              ]),
              game,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Could not patch restart().")

          game, n = re.subn(
              r"(void run\(void\) \{\s*\n\s*// local vars\s*\n\s*int cleared = 0;)",
              r"\1\n\n    loadSave();",
              game,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Could not add loadSave().")

          old_input = (
              r"\n\s*if \(key_hit\(BUTTON_START\)\)\s*\n"
              r"\s*state = START;\s*\n"
              r"\s*\n"
              r"\s*switch \(state\)"
          )
          input_lines = [
              "",
              "    if (key_hit(BUTTON_START)) {",
              "        if (state == TITLE) {",
              "            state = START;",
              "        } else if (state == PAUSE) {",
              "            state = pausedState;",
              "            pauseDirty = 1;",
              "            restoreGameplayScreen();",
              "        } else if (state == SCORES) {",
              "            state = TITLE;",
              "            titleDirty = 1;",
              "            titleBackgroundDrawn = 0;",
              "        } else if (state != START && state != GAMEOVER) {",
              "            pausedState = state;",
              "            state = PAUSE;",
              "            pauseDirty = 1;",
              "        }",
              "    }",
              "",
              "    switch (state)",
          ]
          game, n = re.subn(old_input, "\n".join(input_lines), game, count=1)
          if n != 1:
              raise SystemExit("ERROR: Could not patch START behavior.")

          title_pattern = (
              r"    case TITLE:\s*\n"
              r"\s*if \(key_hit\(BUTTON_START\)\)\s*\n"
              r"\s*state = START;\s*\n"
              r"\s*\n"
              r"\s*waitForVBlank\(\);\s*\n"
              r"\s*drawFullScreenImageDMA\(title\);\s*\n"
              r"\s*break;"
          )
          title_lines = [
              "    case TITLE:",
              "        if (key_hit(BUTTON_UP)) {",
              "            menuSelection = (menuSelection + 3) % 4;",
              "            titleDirty = 1;",
              "        }",
              "        if (key_hit(BUTTON_DOWN)) {",
              "            menuSelection = (menuSelection + 1) % 4;",
              "            titleDirty = 1;",
              "        }",
              "        if (key_hit(BUTTON_A)) {",
              "            if (menuSelection == 0) {",
              "                state = START;",
              "            } else if (menuSelection == 1) {",
              "                difficulty = (difficulty + 1) % 3;",
              "                saveData();",
              "                titleDirty = 1;",
              "            } else if (menuSelection == 2) {",
              "                musicEnabled = !musicEnabled;",
              "                saveData();",
              "                titleDirty = 1;",
              "            } else {",
              "                state = SCORES;",
              "                scoresDirty = 1;",
              "            }",
              "        }",
              "        if (state == TITLE && titleDirty) {",
              "            drawTitleMenu();",
              "            titleDirty = 0;",
              "        }",
              "        break;",
          ]
          game, n = re.subn(title_pattern, "\n".join(title_lines), game, count=1)
          if n != 1:
              raise SystemExit("ERROR: Could not patch TITLE state.")

          cases_lines = [
              "    case PAUSE:",
              "        if (pauseDirty) {",
              "            waitForVBlank();",
              "            drawCenteredShadowString(68, 48, 144, 8, \"PAUSED\", COL_YELLOW);",
              "            drawCenteredShadowString(86, 48, 144, 8, \"START - RESUME\", COL_WHITE);",
              "            pauseDirty = 0;",
              "        }",
              "        break;",
              "",
              "    case SCORES:",
              "        if (key_hit(BUTTON_A) || key_hit(BUTTON_B)) {",
              "            state = TITLE;",
              "            titleDirty = 1;",
              "            titleBackgroundDrawn = 0;",
              "            break;",
              "        }",
              "        if (scoresDirty) {",
              "            drawScoresScreen();",
              "            scoresDirty = 0;",
              "        }",
              "        break;",
              "",
          ]
          game, n = re.subn(
              r"(\s*case GAMEOVER:)",
              "\n" + "\n".join(cases_lines) + r"\1",
              game,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Could not insert PAUSE/SCORES.")

          gameover_pattern = (
              r"    case GAMEOVER:\s*\n"
              r"\s*stop_music\(\);\s*\n"
              r"\s*for \(unsigned int i = 0; i < sizeof\(highscores\) / sizeof\(int\); i\+\+\) \{\s*\n"
              r"\s*if \(score < highscores\[i\]\)\s*\n"
              r"\s*continue;\s*\n"
              r"\s*int tmp = highscores\[i\];\s*\n"
              r"\s*highscores\[i\] = score;\s*\n"
              r"\s*score = tmp;\s*\n"
              r"\s*\}\s*\n"
              r"\s*\n"
              r"\s*if \(key_hit\(BUTTON_START\)\)\s*\n"
              r"\s*state = START;\s*\n"
              r"\s*\n"
              r"\s*break;"
          )
          go_lines = [
              "    case GAMEOVER:",
              "        if (!gameOverHandled) {",
              "            stop_music();",
              "            recordHighScore(score);",
              "            gameOverHandled = 1;",
              "            waitForVBlank();",
              "            drawCenteredShadowString(50, 42, 156, 8, \"GAME OVER\", COL_YELLOW);",
              "            char finalLine[24];",
              "            snprintf(finalLine, sizeof(finalLine), \"SCORE: %d\", score);",
              "            drawCenteredShadowString(68, 42, 156, 8, finalLine, COL_WHITE);",
              "            snprintf(finalLine, sizeof(finalLine), \"BEST: %d\", highscores[0]);",
              "            drawCenteredShadowString(82, 42, 156, 8, finalLine, COL_YELLOW);",
              "            drawCenteredShadowString(102, 42, 156, 8, \"A - PLAY AGAIN\", COL_WHITE);",
              "            drawCenteredShadowString(114, 42, 156, 8, \"B - MAIN MENU\", COL_WHITE);",
              "        }",
              "        if (key_hit(BUTTON_A)) {",
              "            state = START;",
              "        } else if (key_hit(BUTTON_B)) {",
              "            state = TITLE;",
              "            titleDirty = 1;",
              "            titleBackgroundDrawn = 0;",
              "        }",
              "        break;",
          ]
          game, n = re.subn(gameover_pattern, "\n".join(go_lines), game, count=1)
          if n != 1:
              raise SystemExit("ERROR: Could not patch GAMEOVER.")

          game_path.write_text(game)
          header_path.write_text(header)
          print("Applied Sandtris: Miyoo Edition v0.3.0 final polish patch")
          PY

      - name: Apply Hard Mode Water Mud Heat system
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/mud_heat_patch.py
          python3 /tmp/mud_heat_patch.py

      - name: Verify Hard Mode Element System
        run: |
          grep -n "ELEMENT_WATER" game.c
          grep -n "ELEMENT_HEAT" game.c
          grep -n "MUD_COLOR" game.c
          grep -n "spreadMudFrom" game.c
          grep -n "spreadHeatFrom" game.c
          grep -n "activateElementPiece" game.c

      - name: Allow large embedded audio string
        run: |
          sed -i 's/-Werror=vla/-Werror=vla -Wno-error=overlength-strings/' Makefile

      - name: Verify v0.3.0 patch
        run: |
          grep -n "MIYOO EDITION v0.3.0" game.c
          grep -n "SRAM_V113" game.c
          grep -n "restoreTitleStrip" game.c
          grep -n "drawShadowString" game.c
          grep -n "drawCenteredShadowString" game.c
          grep -n "restoreGameplayScreen" game.c
          ! grep -n "drawDitherPanel" game.c
          grep -n "updatePieceMiyoo" game.c
          grep -n "case PAUSE" game.c
          grep -n "case SCORES" game.c
          grep -n "PAUSE" game.h
          grep -n "SCORES" game.h
          grep -n "typeA_loopBlocks" assets/typeA.h

      - name: Build ROM
        run: make

      - name: Rename ROM
        run: |
          test -f Sandtris.gba
          cp Sandtris.gba "Sandtris - Miyoo Edition v0.3.0 Mud Heat Experimental FIX2.gba"
          ls -lh "Sandtris - Miyoo Edition v0.3.0 Mud Heat Experimental FIX2.gba"
          sha256sum "Sandtris - Miyoo Edition v0.3.0 Mud Heat Experimental FIX2.gba"

      - name: Upload Miyoo Edition ROM
        uses: actions/upload-artifact@v4
        with:
          name: Sandtris-Miyoo-v0.3.0-Mud-Heat-Experimental-FIX2
          path: "Sandtris - Miyoo Edition v0.3.0 Mud Heat Experimental FIX2.gba"
          if-no-files-found: error
